<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login - Abrigo de Animais </title>
    
</head>
<body>

    <main class="conteudo-principal">
        <div class="card-login">
            <div class="login-banner">
                <h1>Lista de Pets</h1>
                <p>Acesse a gestão de animais</p>
            </div>

            <form action="#" method="POST" class="form-login">
                <div class="campo-grupo">
                    <label for="login">E-mail ou Nome de Usuário</label>
                    <input type="text" id="login" name="login" required placeholder="Digite seu e-mail ou nome de usuário">
                </div>

                <div class="campo-grupo">
                    <label for="senha">Senha de Acesso</label>
                    <input type="password" id="senha" name="senha" required placeholder="Gigite sua senha">
                </div>

                <button type="submit" class="bot-entrar"> Acessar </button>
            </form>
        </div>
    </main>


<!-- rodapé -->
    <footer class="rodape-sistema">
        <p>Sistema Cadastro Adoção Pets</p>
    </footer>

</body>
</html>
